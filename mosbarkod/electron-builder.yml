appId: com.mosbarkodyazilim.pos
productName: MOSBARKODYAZILIM
copyright: Copyright © 2026 MOSBARKODYAZILIM
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*.cjs
  - package.json
asar: true
npmRebuild: false

win:
  target:
    - nsis
    - portable
  icon: public/icons/icon-512.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MOSBARKODYAZILIM
  artifactName: MOSBARKODYAZILIM-Setup-${version}.${ext}
portable:
  artifactName: MOSBARKODYAZILIM-Portable-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office
  icon: public/icons/icon-512.png
  maintainer: MOSBARKODYAZILIM
  synopsis: Yapay Zeka Destekli Barkod Satış Programı
  description: Yapay Zeka Destekli Barkod Satış Programı
appImage:
  artifactName: MOSBARKODYAZILIM-${version}-${arch}.${ext}

mac:
  target:
    - dmg
  icon: public/icons/icon-512.png
