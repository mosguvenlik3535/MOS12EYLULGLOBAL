appId: com.mosbarkodyazilim.pos
productName: MOSBARKODYAZILIM
copyright: Copyright © 2026 MOSBARKODYAZILIM
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*.cjs
  - package.json
asar: true
npmRebuild: false

win:
  target:
    - nsis
    - portable
  icon: public/icons/icon-512.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MOSBARKODYAZILIM
  artifactName: MOSBARKODYAZILIM-Setup-${version}.${ext}
portable:
  artifactName: MOSBARKODYAZILIM-Portable-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office
  icon: public/icons/icon-512.png
  maintainer: MOSBARKODYAZILIM
  synopsis: Barkod Satış ve Stok Programı
  description: Barkod Satış ve Stok Programı
appImage:
  artifactName: MOSBARKODYAZILIM-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icons/icon-512.png
  category: public.app-category.business
  identity: null
  extendInfo:
    NSCameraUsageDescription: Barkod okuma ve ürün tanıma için kamera erişimi gerekir.
    NSMicrophoneUsageDescription: Görüşme özelliği için mikrofon erişimi gerekir.
    NSLocalNetworkUsageDescription: Yazıcı ve yerel ağdaki cihazlarla bağlantı için erişim gerekir.
dmg:
  artifactName: MOS-POS-${version}-${arch}.${ext}
