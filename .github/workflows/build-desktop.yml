name: Build Desktop (Windows EXE + Linux AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
            artifact: win
          - os: ubuntu-latest
            args: --linux AppImage
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mosbarkod
        run: npm install

      - name: Build web app
        working-directory: mosbarkod
        run: npm run build

      - name: Package with electron-builder
        working-directory: mosbarkod
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSBARKODYAZILIM-${{ matrix.artifact }}
          path: |
            mosbarkod/release/*.exe
            mosbarkod/release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MOSBARKODYAZILIM-*
          merge-multiple: true
          path: release-files

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "MOSBARKODYAZILIM ${{ github.ref_name }}" \
            --notes "Windows kurulum (.exe) ve Linux (AppImage) masaüstü sürümleri." \
            release-files/* 2>/dev/null || \
          gh release upload "${{ github.ref_name }}" release-files/* --clobber
