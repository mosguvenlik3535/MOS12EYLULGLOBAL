name: Build Desktop (Windows EXE + Linux AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
            glob: '*.exe'
          - os: ubuntu-latest
            args: --linux AppImage
            glob: '*.AppImage'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mosbarkod
        run: npm install

      - name: Build web app
        working-directory: mosbarkod
        run: npm run build

      - name: Package with electron-builder
        working-directory: mosbarkod
        run: npx electron-builder ${{ matrix.args }} --publish never

      # ---- DEMO sürüm (yalnızca Windows) ----
      - name: Build demo web app
        if: matrix.os == 'windows-latest'
        working-directory: mosbarkod
        shell: bash
        run: VITE_DEMO=1 npm run build

      - name: Package demo with electron-builder
        if: matrix.os == 'windows-latest'
        working-directory: mosbarkod
        shell: bash
        run: npx electron-builder --config electron-builder.demo.yml --win nsis portable --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSBARKODYAZILIM-${{ matrix.os == 'windows-latest' && 'win' || 'linux' }}
          path: |
            mosbarkod/release/${{ matrix.glob }}
            mosbarkod/release-demo/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls mosbarkod/release/${{ matrix.glob }} mosbarkod/release-demo/*.exe 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::warning::release dosyası bulunamadı"
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            --title "MOSBARKODYAZILIM ${{ github.ref_name }}" \
            --notes "Yapay Zeka Destekli Barkod Satış Programı — masaüstü (Windows .exe + DEMO) ve Linux (AppImage) sürümleri." \
            2>/dev/null || true
          for i in 1 2 3; do
            if gh release upload "${{ github.ref_name }}" $files --clobber; then
              echo "upload ok (attempt $i)"
              break
            fi
            echo "::warning::upload attempt $i failed, retrying..."
            sleep 20
            [ "$i" = "3" ] && exit 1
          done
