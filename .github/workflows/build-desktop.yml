name: Build Desktop (Windows EXE + Linux AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
            glob: '*.exe'
          - os: ubuntu-latest
            args: --linux AppImage
            glob: '*.AppImage'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mosbarkod
        run: npm install

      - name: Build web app
        working-directory: mosbarkod
        run: npm run build

      - name: Package with electron-builder
        working-directory: mosbarkod
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSBARKODYAZILIM-${{ matrix.os == 'windows-latest' && 'win' || 'linux' }}
          path: mosbarkod/release/${{ matrix.glob }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls mosbarkod/release/${{ matrix.glob }} 2>/dev/null || true)
          if [ -n "$files" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "MOSBARKODYAZILIM ${{ github.ref_name }}" \
              --notes "Yapay Zeka Destekli Barkod Satış Programı — masaüstü (Windows .exe) ve Linux (AppImage) sürümleri." \
              $files 2>/dev/null || \
            gh release upload "${{ github.ref_name }}" $files --clobber
          else
            echo "::warning::release dosyası bulunamadı"
            exit 1
          fi
