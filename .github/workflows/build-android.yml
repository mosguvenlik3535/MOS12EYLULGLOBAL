name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish Android artifacts to the package version release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest'te Android SDK önceden kurulu (/usr/local/lib/android/sdk).
      # setup-android@v3, Google'ın 15 Eyl 2026'da kaldırdığı eski 'tools' paketini
      # istediği için kurulum adımında patlıyor — bu yüzden kullanılmıyor.
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT" || exit 1
          rm -rf "${ANDROID_SDK_ROOT:?}/tools"

      - name: Install dependencies
        working-directory: mosbarkod
        run: npm install

      - name: Compute version (package.json)
        id: version
        working-directory: mosbarkod
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          C=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number); console.log(a*10000+b*100+c)" "$V")
          echo "VERSION_CODE=$C" >> "$GITHUB_OUTPUT"

      # ---- TAM SÜRÜM APK ----
      - name: Build web app
        working-directory: mosbarkod
        run: npm run build

      - name: Sync Capacitor
        working-directory: mosbarkod
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: mosbarkod/android
        env:
          MOS_VERSION_NAME: ${{ steps.version.outputs.VERSION }}
          MOS_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSBARKODYAZILIM-Android-APK
          path: mosbarkod/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach full APK to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.VERSION }}" \
            --target "${{ github.sha }}" \
            --title "MOSBARKODYAZILIM v${{ steps.version.outputs.VERSION }}" \
            --notes "Barkod Satış Programı — Windows (.exe + DEMO), Linux (AppImage) ve Android (APK + DEMO) sürümleri." \
            mosbarkod/android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || \
          gh release upload "v${{ steps.version.outputs.VERSION }}" mosbarkod/android/app/build/outputs/apk/debug/app-debug.apk --clobber

      # ---- PLAY STORE AAB (imzalı release, 1.000 satışlık demo) ----
      - name: Build Play web app (1.000 satışlık demo)
        working-directory: mosbarkod
        run: VITE_PLAY=1 npm run build

      - name: Sync Capacitor (Play)
        working-directory: mosbarkod
        run: npx cap sync android

      - name: Build release AAB (signed)
        working-directory: mosbarkod/android
        env:
          MOS_VERSION_NAME: ${{ steps.version.outputs.VERSION }}
          MOS_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          MOS_KEYSTORE_BASE64: ${{ secrets.MOS_KEYSTORE_BASE64 }}
          MOS_KEYSTORE_PASSWORD: ${{ secrets.MOS_KEYSTORE_PASSWORD }}
          MOS_KEY_ALIAS: ${{ secrets.MOS_KEY_ALIAS }}
          MOS_KEY_PASSWORD: ${{ secrets.MOS_KEY_PASSWORD }}
        run: |
          if [ -z "$MOS_KEYSTORE_BASE64" ]; then
            echo "::error::MOS_KEYSTORE_BASE64 secret'i yok — imzalı AAB üretilmedi. Keystore secret'larını ekleyin."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$MOS_KEYSTORE_BASE64" | base64 -d > app/mos-release.jks
          export MOS_KEYSTORE_PATH="$(pwd)/app/mos-release.jks"
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSBARKODYAZILIM-Android-AAB
          path: mosbarkod/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach AAB to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB=mosbarkod/android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            gh release upload "v${{ steps.version.outputs.VERSION }}" "$AAB" --clobber
          else
            echo "::warning::AAB bulunamadı (imzalama secret'ları eksik olabilir)."
          fi

      # ---- DEMO SÜRÜM APK ----
      - name: Build demo web app
        working-directory: mosbarkod
        run: VITE_DEMO=1 npm run build

      - name: Sync Capacitor (demo)
        working-directory: mosbarkod
        run: npx cap sync android

      - name: Build demo APK (debug)
        working-directory: mosbarkod/android
        env:
          MOS_APP_ID: com.mosbarkodyazilim.pos.demo
          MOS_VERSION_NAME: ${{ steps.version.outputs.VERSION }}
          MOS_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Stage demo APK
        working-directory: mosbarkod/android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-demo.apk

      - name: Upload demo APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSBARKODYAZILIM-Android-APK-Demo
          path: mosbarkod/android/app/build/outputs/apk/debug/app-debug-demo.apk
          if-no-files-found: error

      - name: Attach demo APK to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.version.outputs.VERSION }}" mosbarkod/android/app/build/outputs/apk/debug/app-debug-demo.apk --clobber
